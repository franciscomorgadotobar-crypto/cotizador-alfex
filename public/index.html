<style>
/* ═══ Industry design system · marca ALFEX (naranjo + gris) ═══ */
:root{
  --color-bg:#f2f2f3;
  --color-surface:#e9e9ea;
  --color-text:#1d1f20;
  --color-divider:color-mix(in srgb, #1d1f20 16%, transparent);
  --color-accent:#e2651c;
  --color-accent-2:#8a8d90;
  --color-accent-100:#fdf1e8;
  --color-accent-200:#fadfc9;
  --color-accent-300:#f6c39c;
  --color-accent-400:#f0a26c;
  --color-accent-500:#e8813f;
  --color-accent-600:#cf5d16;
  --color-accent-700:#a84a11;
  --color-accent-800:#7a360c;
  --color-accent-900:#3e3f42;
  --color-neutral-100:#f5f5f8; --color-neutral-200:#e7e7ea; --color-neutral-300:#d4d4d7;
  --color-neutral-400:#b7b7ba; --color-neutral-500:#98989b; --color-neutral-600:#7a7a7d;
  --color-neutral-700:#5d5d60; --color-neutral-800:#424244; --color-neutral-900:#2b2b2d;
  --font-heading:"Barlow Condensed", system-ui, sans-serif;
  --font-body:"Barlow", system-ui, sans-serif;
  --space-1:3.4px; --space-2:6.8px; --space-3:10.2px; --space-4:13.6px; --space-6:20.4px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  background:var(--color-neutral-300);
  color:var(--color-text);
  font-family:var(--font-body);
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-0.015em;margin:0 0 var(--space-2);}
p{margin:0 0 var(--space-3);}
:focus{outline:none;}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px;}
::selection{background:color-mix(in srgb, var(--color-accent) 30%, transparent);}
img{display:block;max-width:100%;}
figure{margin:0;}

/* ── Objetos de plano ── */
.blueprint{position:relative;border:1px solid var(--color-divider);border-radius:0;}
.blueprint>.corner{position:absolute;width:11px;height:11px;color:color-mix(in srgb, var(--color-text) 55%, transparent);}
.blueprint>.corner::before,.blueprint>.corner::after{content:"";position:absolute;background:currentColor;}
.blueprint>.corner::before{left:5px;top:0;width:1px;height:100%;}
.blueprint>.corner::after{top:5px;left:0;width:100%;height:1px;}
.blueprint>.corner.tl{top:-6px;left:-6px;} .blueprint>.corner.tr{top:-6px;right:-6px;}
.blueprint>.corner.bl{bottom:-6px;left:-6px;} .blueprint>.corner.br{bottom:-6px;right:-6px;}

/* ── Botones ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
  font-family:var(--font-heading);font-weight:600;font-size:14px;line-height:1.2;
  color:var(--color-text);background:transparent;border:1px solid var(--color-divider);
  border-radius:0;padding:var(--space-2) calc(var(--space-3)*1.2);min-height:44px;}
.btn svg{display:block;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--color-accent);color:var(--color-bg);border-color:var(--color-accent);}
.btn-primary:hover{background:var(--color-accent-600);}
.btn-primary:active{background:var(--color-accent-700);}
.btn-secondary:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);}
.btn-secondary:active{background:color-mix(in srgb, var(--color-text) 14%, transparent);}
.btn-ghost{color:var(--color-accent);border-color:transparent;padding-inline:var(--space-1);min-height:0;}
.btn-ghost:hover{background:color-mix(in srgb, var(--color-accent) 10%, transparent);}
.btn-block{width:100%;margin-top:var(--space-2);}

/* ── Formularios ── */
.input{width:100%;min-height:44px;padding:6px 10px;font:inherit;font-size:14px;
  color:var(--color-text);caret-color:var(--color-accent);background:var(--color-surface);
  border:1px solid var(--color-divider);border-radius:0;}
.input:hover{border-color:color-mix(in srgb, var(--color-text) 45%, transparent);}
.input:focus-visible{border-color:var(--color-accent);outline-offset:0;}
textarea.input{min-height:44px;resize:vertical;}
.cap{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;opacity:.7;}

/* Buscador con lista desplegable (autocompletar cliente/sucursal, contacto) */
.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--color-surface);
  border:1px solid var(--color-divider);max-height:220px;overflow-y:auto;}
.autocomplete-item{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--color-divider);
  padding:9px 10px;font-size:12.5px;font-family:inherit;color:var(--color-text);cursor:pointer;}
.autocomplete-item:last-child{border-bottom:none;}
.autocomplete-item:hover{background:color-mix(in srgb, var(--color-text) 6%, transparent);}
.autocomplete-item .s{display:block;font-size:10px;opacity:.6;margin-top:1px;}
.autocomplete-item.autocomplete-nuevo{color:var(--color-accent-700);font-weight:600;}

/* ── Tarjetas, tags, tablas ── */
.card{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3);
  border-radius:0;background:transparent;border:1px solid var(--color-divider);}
.card-kicker{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent);}
.card-title{font-family:var(--font-heading);font-weight:600;font-size:17px;line-height:1.2;text-wrap:pretty;}
.tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.02em;padding:3px 10px;border-radius:0;}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800);}
.tag-neutral{background:var(--color-neutral-100);color:var(--color-neutral-800);}
.tag-outline{border:1px solid var(--color-accent);color:var(--color-accent);}
.table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:color-mix(in srgb, var(--color-text) 60%, transparent);
  padding:var(--space-2);border-bottom:1px solid var(--color-divider);}
.table td{padding:var(--space-2);border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);}
.table .num{text-align:right;font-family:var(--font-heading);font-weight:600;font-size:15px;white-space:nowrap;}

/* ═══ Chrome de la app ═══ */
#app{width:100%;max-width:520px;margin:0 auto;min-height:100vh;background:var(--color-bg);
  border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider);
  display:flex;flex-direction:column;position:relative;overflow:hidden;}
header.top{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;
  border-bottom:1px solid var(--color-divider);flex:none;background:var(--color-bg);}
.logo-img{height:26px;width:auto;display:block;flex:none;}
.bajada{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;}
.netchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-divider);
  padding:5px 8px;font-family:var(--font-heading);font-weight:600;font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;cursor:pointer;background:transparent;color:var(--color-text);}
.netchip i{width:7px;height:7px;background:var(--color-neutral-600);display:block;}
.netchip.on i{background:var(--color-accent);}
.netchip.warn i{background:var(--color-accent-400);}
.iconbtn{width:36px;height:36px;min-height:36px;padding:0;display:inline-flex;align-items:center;
  justify-content:center;border:1px solid var(--color-divider);background:transparent;cursor:pointer;
  flex:none;color:var(--color-text);}
.iconbtn:hover{background:color-mix(in srgb, var(--color-text) 7%, transparent);}
.btn-volver{font-size:12px;margin-bottom:8px;padding-inline:0;}

nav.roles{display:flex;border-bottom:1px solid var(--color-divider);flex:none;}
nav.roles button{flex:1;font-family:var(--font-heading);font-weight:600;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.1em;padding:10px 4px;cursor:pointer;
  background:var(--color-surface);color:color-mix(in srgb, var(--color-text) 65%, transparent);
  border:none;border-right:1px solid var(--color-divider);min-height:40px;}
nav.roles button:last-child{border-right:none;}
nav.roles button.on{background:var(--color-accent-900);color:var(--color-bg);}

main{flex:1;overflow:auto;padding:14px 14px 26px;scrollbar-width:none;}
main::-webkit-scrollbar{width:0;height:0;}
.view{display:none;} .view.on{display:block;}

.h2row{display:flex;align-items:baseline;gap:8px;}
h2{font-size:26px;} .h2big{font-size:29px;}
.sub{font-size:12.5px;opacity:.7;}
.kick{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--color-accent);}

/* Selector de recintos */
.recintos{display:flex;gap:7px;padding:2px 0 12px;overflow-x:auto;scrollbar-width:none;}
.recintos::-webkit-scrollbar{height:0;}
.recintos .btn{flex:none;font-size:12.5px;white-space:nowrap;min-height:38px;}
.recinto-chip{display:inline-flex;flex:none;}
.recinto-chip .btn:first-child{border-right:none;}
.recinto-chip .del-rec{flex:none;min-height:38px;min-width:30px;padding:0 8px;color:var(--color-accent-700);border:1px solid var(--color-divider);font-size:16px;}
.recinto-chip .del-rec:hover{background:var(--color-accent-100);}

/* Partida en terreno */
.dims{display:flex;flex-wrap:wrap;gap:8px;}
.dims label{display:flex;flex-direction:column;gap:3px;}
.dims .input{width:88px;}
.qty{font-family:var(--font-heading);font-weight:600;font-size:23px;color:var(--color-accent-700);line-height:1;text-align:right;}
.qty-un{font-size:10px;text-transform:uppercase;opacity:.6;text-align:right;}
.fotos{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;}
.foto{position:relative;width:54px;height:54px;border:1px solid var(--color-divider);background:var(--color-surface);overflow:hidden;}
.foto img{width:100%;height:100%;object-fit:cover;}
.foto .lbl{position:absolute;left:0;bottom:0;background:var(--color-bg);font-size:8.5px;padding:1px 3px;}
.foto .del{position:absolute;top:0;right:0;background:rgba(29,31,32,.75);color:#fff;border:none;width:16px;height:16px;font-size:11px;line-height:1;cursor:pointer;padding:0;}
.btn-foto{width:54px;height:54px;min-height:54px;flex-direction:column;gap:2px;font-size:9px;padding:0;}

/* Secciones del informe */
.sec{display:flex;align-items:center;gap:9px;margin:20px 0 8px;}
.sec .n{font-family:var(--font-heading);font-weight:600;font-size:11.5px;letter-spacing:.1em;color:var(--color-accent);}
.sec h3{font-size:19px;margin:0;}
.sec .rule{flex:1;height:1px;background:var(--color-divider);}
.chk{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);}
.chk .mk{width:14px;color:var(--color-accent);flex:none;}
.chk .val{margin-left:auto;opacity:.6;text-align:right;}

/* Resumen económico */
.resumen{background:var(--color-accent-900);color:var(--color-bg);padding:15px;}
.resumen .row{display:grid;grid-template-columns:1fr auto;font-size:13px;gap:4px;}
.resumen hr{border:0;height:1px;background:rgba(242,242,243,.35);margin:10px 0;}
.resumen .tot-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;}
.resumen .tot-v{font-family:var(--font-heading);font-weight:600;font-size:29px;line-height:1;}

/* KPI */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.kpi{padding:11px;} .kpi .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;}
.kpi .v{font-family:var(--font-heading);font-weight:600;font-size:26px;color:var(--color-accent-800);line-height:1.1;}
.kpi .s{font-size:11px;opacity:.65;}

/* Sheets */
.overlay{position:absolute;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 52%, transparent);
  display:none;flex-direction:column;justify-content:flex-end;z-index:60;}
.overlay.on{display:flex;}
.overlay .tapzone{flex:1;}
.sheet{background:var(--color-bg);border-top:1px solid var(--color-divider);padding:14px;max-height:74%;overflow:auto;}
.sheet h3{font-size:21px;margin:0;}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* Firma */
#firma-canvas, #firma-terreno-canvas{width:100%;height:120px;border:1px dashed var(--color-divider);background:var(--color-surface);touch-action:none;display:block;}

.toast{position:absolute;left:14px;right:14px;bottom:16px;padding:10px 12px;
  background:var(--color-accent-900);color:var(--color-bg);font-size:12.5px;
  display:none;align-items:center;gap:8px;z-index:80;}
.toast.on{display:flex;}
.toast i{width:7px;height:7px;background:var(--color-accent-300);flex:none;}
.hide{display:none !important;}
@media print{header.top,nav.roles,.no-print{display:none !important;}#app{max-width:none;border:0;}}

/* ═══ Escritorio: el mismo sitio, aprovechando el ancho ═══ */
@media (min-width:860px){
  body{background:var(--color-neutral-200);}
  #app{max-width:1040px;border-left:1px solid var(--color-divider);border-right:1px solid var(--color-divider);
    min-height:100vh;box-shadow:0 0 0 1px var(--color-divider);}
  header.top{padding:16px 24px 14px;}
  main{padding:22px 28px 40px;}
  nav.roles button{min-height:46px;font-size:11.5px;cursor:pointer;}
  .recintos{flex-wrap:wrap;overflow-x:visible;}
  .kpis{grid-template-columns:repeat(4,1fr);}
  .list-grid{display:grid !important;grid-template-columns:1fr 1fr;gap:14px !important;align-items:start;}
  .resumen{max-width:420px;margin-left:auto;}
  .overlay{align-items:center;justify-content:center;background:color-mix(in srgb, var(--color-neutral-900) 45%, transparent);}
  .overlay .tapzone{flex:none;width:100%;height:100%;position:absolute;inset:0;}
  .sheet{position:relative;width:min(560px,92vw);max-height:80vh;border:1px solid var(--color-divider);
    box-shadow:0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);}
  .toast{left:50%;right:auto;transform:translateX(-50%);width:min(420px,90%);}
}
</style>
</head>

<div id="app">
  <header class="top">

    </button>
    <button class="netchip" id="netchip" title="Estado de sincronización"><i></i><span>Sin red</span></button>

  <nav class="roles">

    <section class="view" id="v-oficina"></section>
    <section class="view" id="v-clientes"></section>
    <section class="view" id="v-cliente-detalle"></section>

    <section class="view" id="v-config"></section>
    <section class="view" id="v-tutorial"></section>
  </main>

  <div class="overlay" id="overlay">
    <div class="tapzone" id="overlay-tap"></div>
    <div class="sheet" id="sheet"></div>
  </div>

  <div class="toast" id="toast"><i></i><span></span></div>
</div>

/* ═══════════ DATOS BASE (del handoff de diseño) ═══════════ */
const UNIDADES = {m2:'m²', m3:'m³', ml:'ml', un:'un', gl:'gl', dia:'día'};

                      fono:'+56 9529 0514', fono2:'+56 9 3503 7653', rubro:'Obras civiles'};

const LS_KEY = 'alfex_lt_v2';

                       cotizado:['Cotizado','tag-outline'], aprobada:['Aprobada','tag-neutral']};

/* ═══════════ ESTADO ═══════════ */

function loadDB(){
  let raw=null;
  try{ raw = localStorage.getItem(LS_KEY); }catch(e){}
  if(raw){ try{ db = JSON.parse(raw); }catch(e){ db=null; } }
  if(!db || typeof db!=='object') db = {};

  if(!Array.isArray(db.catalogo) || !db.catalogo.length) db.catalogo = CATALOGO_BASE.map(c=>({id:uid(), ...c}));
  db.params  = Object.assign({}, PARAMS_BASE, db.params||{});

  if(!db.seqCT) db.seqCT = 100;

  if(!db.fotosSubidas || typeof db.fotosSubidas!=='object') db.fotosSubidas = {};
  if(!db.ajustesTs) db.ajustesTs = 0;
  // Datos de la version anterior: se convierten al modelo del diseno.
  db.ots = db.ots.map(o=> (o && !o.recintos && Array.isArray(o.partidas)) ? migrarV1(o) : o).filter(Boolean).map(normalizarOT);

  if(!Array.isArray(db.historial)) db.historial = [];
  if(!db.historialDirty) db.historialDirty = false;
}

/* ── Fotos: IndexedDB local + nube ── */
let idbP = null;
function idb(){
  if(idbP) return idbP;
  idbP = new Promise((res,rej)=>{
    if(!window.indexedDB){ rej(new Error('sin idb')); return; }
    const rq = indexedDB.open('alfex_fotos', 1);
    rq.onupgradeneeded = ()=> rq.result.createObjectStore('fotos', {keyPath:'id'});
    rq.onsuccess = ()=> res(rq.result);
    rq.onerror = ()=> rej(rq.error);
  });
  return idbP;
}
async function photoPut(rec){
  try{
    const d = await idb();
    await new Promise((res,rej)=>{ const tx=d.transaction('fotos','readwrite'); tx.objectStore('fotos').put(rec); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  }catch(e){}
  photoCache.set(rec.id, rec);
}
async function photoGet(id, permitirNube = true){
  if(photoCache.has(id)) return photoCache.get(id);
  let rec = null;
  try{
    const d = await idb();
    rec = await new Promise((res,rej)=>{ const rq=d.transaction('fotos').objectStore('fotos').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); });
  }catch(e){}
  if(rec){ photoCache.set(id, rec); return rec; }
  if(permitirNube && NUBE.hayApi && NUBE.token){
    try{
      const r = await api('fotos/'+id);
      if(r && r.full){
        const c = {id, full:r.full, thumb:r.thumb||r.full, w:r.w||1, h:r.h||1};
        await photoPut(c); db.fotosSubidas[id]=1; return c;
      }
    }catch(e){}
  }
  return null;
}
async function photoDel(id){
  photoCache.delete(id);
  try{
    const d = await idb();
    await new Promise((res,rej)=>{ const tx=d.transaction('fotos','readwrite'); tx.objectStore('fotos').delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); });
  }catch(e){}
}
function fileToPhoto(file, id){
  return new Promise((resolve,reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=> reject(fr.error);
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('imagen inválida'));
      img.onload = ()=>{
        const draw = (max,q)=>{
          const sc = Math.min(1, max/Math.max(img.width,img.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1,Math.round(img.width*sc));
          c.height = Math.max(1,Math.round(img.height*sc));
          c.getContext('2d').drawImage(img,0,0,c.width,c.height);
          return {data:c.toDataURL('image/jpeg',q), w:c.width, h:c.height};
        };
        const full = draw(1400,0.72), th = draw(220,0.6);
        resolve({id, full:full.data, thumb:th.data, w:full.w, h:full.h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/** Convierte un levantamiento de la version anterior (capitulos + lineas de
 *  medicion) al modelo del diseno (recintos + partidas), conservando cantidades. */
function migrarV1(v){
  if(!v || v.recintos || !Array.isArray(v.partidas)) return v;
  const U = {m2:'m2', m3:'m3', ml:'ml', un:'un', gl:'gl', kg:'un', hh:'un', 'día':'dia'};
  const dimsDe = u => (u==='m2'||u==='m3') ? ['largo','alto'] : (u==='ml' ? ['largo'] : ['cantidad']);
  const cant = pa => (pa.meds||[]).reduce((acc,m)=>{
    const n = (m.n===''||m.n==null) ? 1 : (parseFloat(String(m.n).replace(',','.'))||0);
    const d = k => parseFloat(String(m[k]??'').replace(',','.'))||0;
    if(pa.unit==='m2') return acc + n*d('l')*d('a');
    if(pa.unit==='m3') return acc + n*d('l')*d('a')*d('h');
    if(pa.unit==='ml') return acc + n*d('l');
    return acc + n;
  }, 0);
  const items = (v.partidas||[]).map(pa=>({
    id: pa.id || uid(), code: (pa.cap||'MIG').slice(0,3).toUpperCase(), familia: pa.cap || 'Migrado',
    desc: pa.name || '(sin nombre)', unidad: U[pa.unit] || 'un', pu: 0,
    dims:['cantidad'], med:{cantidad: +cant(pa).toFixed(3)}, nota: pa.obs || ''
  }));
  const recinto = {id: uid(), nombre:'Levantamiento', items};
  const checks = {}; CHECKLIST_BASE.forEach(c=> checks[c.key] = {on:false, valor:''});
  if(v.acceso) checks.acceso = {on:true, valor: v.acceso.slice(0,60)};
  return {
    id: v.id, codigo: v.folio || ('OT-' + (db.seqOT++)),
    obra: v.obra||'', cliente: (v.cliente&&v.cliente.nombre)||'', clienteId:null, sucursalId:null,
    contactoObra: (v.cliente&&v.cliente.contacto)||'', contactoObraTelefono:'', email:(v.cliente&&v.cliente.email)||'',
    direccion: v.direccion||'', comuna: v.comuna||'', gps: v.gps||null,
    fechaVisita: v.fecha || hoyISO(), levantoPor: v.responsable||'', estado:'en_terreno', agenda:null,
    checks, recintos:[recinto],
    fotos: (v.fotos||[]).map((f,i)=> ({id:f.id, itemId:f.partidaId, recintoId:recinto.id, label:'F'+(i+1)})),
    cot: {numero:null, excluidas:{}, pu:{}, qty:{}, notas: v.observaciones||'', plazoDias: db.params.plazoDias, utilidadPct: db.params.utilidadDefault},
    firmaTerreno: {firmado:false, por:'', telefono:'', fecha:'', dataUrl:''},
    firma: {firmado:false, por:'', telefono:'', fecha:'', dataUrl:'', via:''},
    createdAt: v.createdAt || Date.now(), updatedAt: v.updatedAt || Date.now(), dirty:true
  };
}
/** Retrocompatibilidad con OT ya guardadas (locales o en la nube) antes de
 *  estos cambios: cliente reemplaza a mandante, y se completan los campos
 *  nuevos con valores neutros para que nada quede undefined. */
function normalizarOT(o){
  if(!o) return o;
  if(!o.cliente && o.mandante) o.cliente = o.mandante;
  if(o.clienteId === undefined) o.clienteId = null;
  if(o.sucursalId === undefined) o.sucursalId = null;
  if(o.contactoObra === undefined) o.contactoObra = '';
  if(o.contactoObraTelefono === undefined) o.contactoObraTelefono = '';
  if(o.agenda === undefined) o.agenda = null;
  if(!o.firmaTerreno) o.firmaTerreno = {firmado:false, por:'', telefono:'', fecha:'', dataUrl:''};
  if(o.firmaTerreno.telefono === undefined) o.firmaTerreno.telefono = '';
  if(o.firma && o.firma.via === undefined) o.firma.via = o.firma.firmado ? 'firma' : '';
  if(o.firma && o.firma.telefono === undefined) o.firma.telefono = '';
  if(o.cot && (o.cot.utilidadPct === undefined || o.cot.utilidadPct === null)){
    o.cot.utilidadPct = db.params.utilidadDefault;
  }
  return o;
}
const getOT = ()=> db.ots.find(o=> o.id === S.otId) || null;
const getRecinto = ot => (ot && ot.recintos[S.areaIdx]) || (ot && ot.recintos[0]) || null;
const todosItems = ot => (ot.recintos||[]).flatMap(r=> r.items.map(i=>({item:i, recinto:r})));

/** La cantidad se calcula: producto de las dimensiones de su unidad. */
function cantidadItem(ot, item){
  const ov = ot.cot.qty[item.id];
  if(ov !== undefined && ov !== '' && ov !== null) return num(ov);
  const dims = item.dims && item.dims.length ? item.dims : ['cantidad'];
  return dims.reduce((acc,d)=> acc * num(item.med[d]), 1);
}
function fotosDeItem(ot, itemId){ return (ot.fotos||[]).filter(f=> f.itemId === itemId); }

/** Fórmulas del handoff, exactas. */
function calcular(ot){
  const lineas = todosItems(ot)
    .filter(({item})=> !ot.cot.excluidas[item.id])
    .map(({item, recinto})=>{
      const cantidad = cantidadItem(ot, item);
      const pu = ot.cot.pu[item.id] !== undefined ? num(ot.cot.pu[item.id]) : num(item.pu);
      return {item, recinto, cantidad, pu, total: cantidad * pu};
    });
  const neto = lineas.reduce((s,l)=> s + l.total, 0);
  const utilidadPct = num(ot.cot.utilidadPct != null ? ot.cot.utilidadPct : db.params.utilidadDefault);
  const gg = neto * db.params.gg;
  const utilidad = neto * utilidadPct;
  const subtotal = neto + gg + utilidad;
  const iva = subtotal * db.params.iva;
  return {lineas, neto, gg, utilidad, utilidadPct, subtotal, iva, total: subtotal + iva};
}
function conteos(ot){
  const items = todosItems(ot);
  return {partidas: items.length, fotos: (ot.fotos||[]).length, recintos: (ot.recintos||[]).length};
}
/** Etiqueta de estado a mostrar: si está en terreno pero ya tiene datos
 *  capturados (y aún no se guardó como cotización), se marca "Sin terminar"
 *  en vez de "En terreno" para que se note que quedó a medio hacer. */
function estadoTag(o){
  if(o.estado === 'en_terreno'){
    const c = conteos(o);
    if(c.partidas > 0 || c.fotos > 0) return ['Sin terminar', 'tag-outline'];
  }
  return ESTADO_LABEL[o.estado] || ESTADO_LABEL.en_terreno;
}
function checksActivos(ot){ return CHECKLIST_BASE.filter(c=> ot.checks[c.key] && ot.checks[c.key].on).length; }

<script>
/* ═══════════ NUBE (offline primero) ═══════════ */
/* El acceso es por persona: nombre + clave, sin niveles de permiso — el
   login es para identificar quien hizo cada cosa, no para restringir. */
const NUBE = {
  disponible: location.protocol === 'http:' || location.protocol === 'https:',
  hayApi: null, token: '', nombre: '', corriendo:false, estado:'local', timer:null
};
try{
  NUBE.token = localStorage.getItem('alfex_token') || '';
  NUBE.nombre = localStorage.getItem('alfex_nombre') || '';
}catch(e){}

async function sha256(texto){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
  return Array.from(new Uint8Array(buf)).map(b=> b.toString(16).padStart(2,'0')).join('');
}
function guardarSesion(token, nombre){
  NUBE.token = token; NUBE.nombre = nombre;
  try{ localStorage.setItem('alfex_token', token); localStorage.setItem('alfex_nombre', nombre); }catch(e){}
}
function cerrarSesion(){
  NUBE.token = ''; NUBE.nombre = '';
  try{ localStorage.removeItem('alfex_token'); localStorage.removeItem('alfex_nombre'); }catch(e){}
  setNube('sinsesion');
}

async function api(ruta, opts={}){
  const headers = Object.assign(NUBE.token ? {'x-alfex-token': NUBE.token} : {}, opts.headers||{});
  if(opts.body) headers['content-type'] = 'application/json';
  const r = await fetch('/api/'+ruta, Object.assign({}, opts, {headers}));
  if(!(r.headers.get('content-type')||'').includes('json')){ NUBE.hayApi = false; throw new Error('sinapi'); }
  if(r.status === 401) throw new Error('sesion');
  if(!r.ok){
    let d=''; try{ d = (await r.json()).error||''; }catch(e){}
    throw new Error(d || ('HTTP '+r.status));
  }
  return r.json();
}
const NUBE_TXT = {
  local:['Sin red',''], sinnube:['Sin red',''], sinsesion:['Sin sesión','warn'],
  sync:['Sincroniza…','warn'], ok:['En línea','on'], pend:['Pendiente','warn'],
  sinred:['Sin red',''], sesionmala:['Sesión inválida','warn'], error:['Error','warn']
};
function setNube(e){
  NUBE.estado = e;
  const [txt, cls] = NUBE_TXT[e] || NUBE_TXT.local;
  const c = $('#netchip');
  if(c){ c.querySelector('span').textContent = txt; c.className = 'netchip ' + cls; }
}
const hayPendientes = ()=> db.ots.some(o=>o.dirty) || (db.borrados||[]).length > 0 || db.historialDirty;
function programarSync(){
  if(!NUBE.disponible || !NUBE.token || NUBE.hayApi === false) return;
  if(hayPendientes()) setNube('pend');
  clearTimeout(NUBE.timer);
  NUBE.timer = setTimeout(()=> sincronizar(), 2500);
}
/** Para acciones críticas y de una sola vez (firmas, guardar cotización,
 *  eliminar OT): no hay que esperar el debounce de 2.5s — si alguien firma
 *  y cierra la pestaña de inmediato, ese cambio podía quedar solo en su
 *  equipo sin llegar nunca a la nube. Se intenta subir al toque, y si
 *  igual queda pendiente (sin señal, o un problema del servidor) se avisa. */
async function sincronizarYa(avisoSiPendiente){
  clearTimeout(NUBE.timer);
  await sincronizar(false);
  if(avisoSiPendiente && NUBE.disponible && NUBE.token && hayPendientes()) toast(avisoSiPendiente);
}
async function sincronizar(manual=false){
  if(!NUBE.disponible){ setNube('local'); return; }
  if(!NUBE.token){ setNube('sinsesion'); return; }
  if(NUBE.hayApi === false){ setNube('sinnube'); return; }
  if(NUBE.corriendo) return;
  if(!navigator.onLine){ setNube('sinred'); return; }
  NUBE.corriendo = true; setNube('sync');
  let cambios = false;
  try{
    for(const id of (db.borrados||[]).slice()){
      await api('levantamientos/'+id, {method:'DELETE'});
      db.borrados = db.borrados.filter(x=> x!==id);
    }
    const remotos = await api('levantamientos') || [];
    for(let r of remotos){
      if(!r || !r.id) continue;
      if(!r.recintos && Array.isArray(r.partidas)){ r = migrarV1(r); cambios = true; }
      normalizarOT(r);
      const local = db.ots.find(o=> o.id === r.id);
      if(!local){ r.dirty = false; db.ots.push(r); cambios = true; }
      else if(!local.dirty && (r.updatedAt||0) > (local.updatedAt||0)){
        // Firmar es un hecho consumado: si ya está firmado localmente y la
        // copia remota (más nueva por reloj, pero de una edición vieja que
        // recién llegó) no lo trae, no se pisa la firma.
        if(local.firma && local.firma.firmado && !(r.firma && r.firma.firmado)) r.firma = local.firma;
        if(local.firmaTerreno && local.firmaTerreno.firmado && !(r.firmaTerreno && r.firmaTerreno.firmado)) r.firmaTerreno = local.firmaTerreno;
        Object.assign(local, r, {dirty:false});
        cambios = true;
      }
    }
    // Dos equipos sin señal pueden emitir el mismo correlativo: se resuelve al sincronizar.
    const nDe = (cod, pre)=>{ const m = String(cod||'').match(new RegExp('^'+pre+'-(\\d+)')); return m ? +m[1] : 0; };
    db.seqOT = Math.max(db.seqOT, ...remotos.map(r=> nDe(r.codigo,'OT') + 1));
    db.seqCT = Math.max(db.seqCT, ...remotos.map(r=> nDe(r.cot && r.cot.numero,'CT') + 1));
    for(const ot of db.ots){
      const choqueOT = remotos.find(r=> r.id !== ot.id && r.codigo === ot.codigo);
      if(choqueOT && ot.dirty){
        const viejo = ot.codigo;
        ot.codigo = 'OT-' + (db.seqOT++);
        cambios = true;
        toast(`${viejo} ya existía: esta pasa a ser ${ot.codigo}.`);
      }
      const choqueCT = ot.cot.numero && remotos.find(r=> r.id !== ot.id && r.cot && r.cot.numero === ot.cot.numero);
      if(choqueCT && ot.dirty){
        ot.cot.numero = 'CT-' + (db.seqCT++) + '/' + String(new Date().getFullYear()).slice(2);
        cambios = true;
      }
    }
    const ids = remotos.map(r=> r && r.id);
    for(const ot of db.ots){
      if(!ot.dirty && ids.includes(ot.id)) continue;
      for(const f of (ot.fotos||[])){
        if(db.fotosSubidas[f.id]) continue;
        const rec = await photoGet(f.id, false);
        if(!rec) continue;
        await api('fotos/'+f.id, {method:'PUT', body: JSON.stringify({full:rec.full, thumb:rec.thumb, w:rec.w, h:rec.h})});
        db.fotosSubidas[f.id] = 1;
      }
      const copia = Object.assign({}, ot); delete copia.dirty;
      await api('levantamientos/'+ot.id, {method:'PUT', body: JSON.stringify(copia)});
      ot.dirty = false;
    }
    const rem = await api('ajustes');
    const ts = (rem && rem.ts) || 0;
    if(ts > (db.ajustesTs||0)){
      db.params  = Object.assign({}, PARAMS_BASE, rem.params||{});
      db.empresa = Object.assign({}, EMPRESA_BASE, rem.empresa||{});
      if(Array.isArray(rem.catalogo) && rem.catalogo.length) db.catalogo = rem.catalogo;
      db.ajustesTs = ts; cambios = true;
    } else if((db.ajustesTs||0) > ts){
      await api('ajustes', {method:'PUT', body: JSON.stringify({params:db.params, empresa:db.empresa, catalogo:db.catalogo, ts:db.ajustesTs})});
    }
    const remCli = await api('clientes');
    const tsCli = (remCli && remCli.ts) || 0;
    if(tsCli > (db.clientesTs||0)){
      if(Array.isArray(remCli.lista)) db.clientes = remCli.lista;
      db.clientesTs = tsCli; cambios = true;
    } else if((db.clientesTs||0) > tsCli){
      await api('clientes', {method:'PUT', body: JSON.stringify({lista:db.clientes, ts:db.clientesTs})});
    }
    // Historial: se une lo remoto con lo local (nunca se pisa, solo se agrega).
    const remHist = await api('historial');
    const remotoHist = Array.isArray(remHist && remHist.lista) ? remHist.lista : [];
    if(remotoHist.length){
      const porId = new Map(db.historial.map(h=> [h.id, h]));
      let nuevo = false;
      remotoHist.forEach(h=>{ if(h && h.id && !porId.has(h.id)){ porId.set(h.id, h); nuevo = true; } });
      if(nuevo){
        db.historial = Array.from(porId.values()).sort((a,b)=> b.ts - a.ts).slice(0, 500);
        cambios = true;
      }
    }
    if(db.historialDirty){
      await api('historial', {method:'PUT', body: JSON.stringify({lista: db.historial})});
      db.historialDirty = false;
    }
    saveLocal();
    setNube(hayPendientes() ? 'pend' : 'ok');
    if(manual) toast('Sincronizado con la nube.');
    if(cambios) render();
  }catch(e){
    const malaSesion = e.message==='sesion', sinApi = e.message==='sinapi';
    if(malaSesion) cerrarSesion(); else setNube(sinApi ? 'sinnube' : 'error');
    saveLocal();
    if(manual) toast(malaSesion ? 'Tu sesión ya no es válida. Vuelve a entrar.' : sinApi ? 'Este sitio no tiene la nube instalada.' : 'No se pudo sincronizar.');
  }finally{ NUBE.corriendo = false; }
}

    </div>

      ${dims.map(d=> `<label><span class="cap">${esc(DIM_LABELS[d]||d)}</span>

  </div>`;
}

function cablearItems(ot){
  const rec = getRecinto(ot);
  $$('[data-item]').forEach(card=>{
    const it = rec.items.find(x=> x.id === card.dataset.item);
    if(!it) return;
    $$('[data-med]', card).forEach(inp=> inp.oninput = ()=>{
      it.med[inp.dataset.med] = inp.value;
      card.querySelector('[data-qty]').textContent = qty(cantidadItem(ot,it));
      save();
    });
    const nota = $('[data-nota]', card);
    if(nota) nota.oninput = ()=>{ it.nota = nota.value; save(); };
  });
}

<script>
/* ═══════════ FOTOS ═══════════ */
async function pintarFotos(ot){
  for(const cont of $$('[data-fotos]')){

      </div>`).join('') +
      `<label class="btn btn-secondary btn-foto" for="cam-${itemId}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        FOTO</label>
      <input type="file" id="cam-${itemId}" accept="image/*" capture="environment" multiple hidden data-cam="${itemId}">
      <label class="btn btn-secondary btn-foto" for="gal-${itemId}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square"><rect x="3" y="3" width="18" height="18" rx="0"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        GALERÍA</label>
      <input type="file" id="gal-${itemId}" accept="image/*" multiple hidden data-gal="${itemId}">
      <button class="btn btn-ghost" data-quitar="${itemId}" style="margin-left:auto;font-size:12px">Quitar</button>`;

    $$('[data-cam]', cont).forEach(inp=> inp.onchange = e=> agregarFotos(e.target.files, inp.dataset.cam));
    $$('[data-gal]', cont).forEach(inp=> inp.onchange = e=> agregarFotos(e.target.files, inp.dataset.gal));
    $$('[data-caption]', cont).forEach(inp=> inp.oninput = ()=>{
      const f = ot.fotos.find(x=> x.id === inp.dataset.caption);
      if(f){ f.caption = inp.value; save(); }

      const id = b.dataset.delfoto;

      if(db.fotosSubidas[id]){ delete db.fotosSubidas[id]; api('fotos/'+id,{method:'DELETE'}).catch(()=>{}); }
      save(); render();
    });
    $$('[data-quitar]', cont).forEach(b=> b.onclick = ()=>{
      const rec = getRecinto(ot);
      const it = rec.items.find(x=> x.id === b.dataset.quitar);
      fotosDeItem(ot, it.id).forEach(f=> photoDel(f.id));
      ot.fotos = ot.fotos.filter(f=> f.itemId !== it.id);
      rec.items = rec.items.filter(x=> x.id !== it.id);
      renumerarFotos(ot);
      save(); render();
    });
    $$('[data-ver]', cont).forEach(img=> img.onclick = async ()=>{
      const r = await photoGet(img.dataset.ver); if(!r) return;
      const w = window.open('');
      if(w) w.document.write(`<title>Foto</title><body style="margin:0;background:#1d1f20"><img src="${r.full}" style="max-width:100%;margin:auto;display:block"></body>`);
    });
  }
}
/** F# secuencial por levantamiento. */
function renumerarFotos(ot){ (ot.fotos||[]).forEach((f,i)=> f.label = 'F'+(i+1)); }

async function agregarFotos(files, itemId){
  const ot = getOT(); if(!ot || !files || !files.length) return;
  const rec = getRecinto(ot);
  toast('Procesando ' + files.length + (files.length===1?' foto…':' fotos…'));
  for(const file of Array.from(files)){
    if(!file.type.startsWith('image/')) continue;
    try{
      const id = uid();
      await photoPut(await fileToPhoto(file, id));
      ot.fotos.push({id, itemId, recintoId: rec.id, label:'F'+(ot.fotos.length+1), caption:''});
    }catch(e){ console.warn(e); }
  }
  renumerarFotos(ot);
  save(); render();
  toast('Foto anotada y asociada a la partida.');
}

  }).join('');

  $('#v-informe').innerHTML = `
    <div class="blueprint" style="background:var(--color-surface);padding:14px">
      <div class="kick">Informe de levantamiento técnico</div>
      <h2 style="font-size:26px">${esc(ot.obra || 'Obra sin nombre')}</h2>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px">
        <span style="opacity:.55">OT</span><span>${esc(ot.codigo)}</span>
        <span style="opacity:.55">Cliente</span><span>${esc(ot.cliente||'—')}</span>
        <span style="opacity:.55">Ubicación</span><span>${esc([ot.direccion, ot.comuna].filter(Boolean).join(' · ')||'—')}${ot.gps?' · '+ot.gps.lat.toFixed(4)+', '+ot.gps.lon.toFixed(4):''}</span>
        <span style="opacity:.55">Visita</span><span>${esc(fechaCorta(ot.fechaVisita))}</span>
        <span style="opacity:.55">Levantó</span><span>${esc(ot.levantoPor||'—')}</span>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">
        <span class="tag tag-accent">${c.partidas} partidas</span>
        <span class="tag tag-neutral">${c.fotos} fotografías</span>
        <span class="tag tag-outline">${c.recintos} recintos</span>
      </div>
    </div>

    <div class="sec"><span class="n">01</span><h3>Condiciones del sitio</h3><span class="rule"></span></div>
    ${CHECKLIST_BASE.map(ck=>{
      const v = ot.checks[ck.key] || {on:false, valor:''};
      return `<div class="chk"><span class="mk">${v.on?'✓':'—'}</span><span>${esc(ck.label)}</span>
        <span class="val">${esc(v.on ? (v.valor || 'Sí') : 'No aplica')}</span></div>`;
    }).join('')}

    ${secciones || '<p class="sub" style="margin-top:16px">Aún no hay partidas levantadas.</p>'}

    <div class="sec"><span class="n">${String(n+1).padStart(2,'0')}</span><h3>Conformidad en terreno (opcional)</h3><span class="rule"></span></div>
    ${ot.firmaTerreno.firmado ? `
      <div class="resumen">
        <div class="cap" style="opacity:.75">Conforme en terreno</div>
        <div style="font-family:var(--font-heading);font-weight:600;font-size:18px">Firmado por ${esc(ot.firmaTerreno.por||ot.contactoObra||'contacto en obra')}</div>
        <div style="font-size:12px;opacity:.8">${esc(ot.firmaTerreno.fecha)}${ot.firmaTerreno.telefono?' · '+esc(ot.firmaTerreno.telefono):''}</div>
        ${ot.firmaTerreno.dataUrl ? `<img src="${ot.firmaTerreno.dataUrl}" style="background:#fff;margin-top:10px;max-height:70px">` : ''}
        <button class="btn btn-ghost" id="b-rehacer-firma-terreno" style="font-size:12px;margin-top:6px">Rehacer firma</button>
      </div>`
    : `
      <p class="sub" style="margin:0 0 8px">Si el contacto en obra queda conforme con lo levantado, puede firmar aquí mismo. No es obligatorio para pasar a cotización.</p>
      ${contactosTerreno.length ? `<label><span class="cap">Contacto ya registrado en el cliente</span>
        <select class="input" id="ft-contacto-sel">
          <option value="">— Escribir uno nuevo —</option>
          ${contactosTerreno.map(s=> `<option value="${s.id}">${esc(s.encargado)} · ${esc(s.nombre)}</option>`).join('')}
        </select></label>` : ''}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:${contactosTerreno.length?'10px':'0'}">
        <label><span class="cap">Nombre de quien firma</span><input class="input" id="ft-nombre" value="${esc(ot.contactoObra||'')}"></label>
        <label><span class="cap">Teléfono</span><input class="input" id="ft-telefono" value="${esc(ot.contactoObraTelefono||'')}"></label>
      </div>
      ${ot.clienteId ? `<label style="display:flex;align-items:center;gap:8px;font-size:12px;margin:10px 0 0">
        <input type="checkbox" id="ft-guardar-contacto" ${ot.sucursalId?'checked':''}> Agregar/actualizar como contacto de la sucursal</label>` : ''}
      <canvas id="firma-terreno-canvas" style="margin-top:10px"></canvas>
      <button class="btn btn-ghost" id="b-limpiar-firma-terreno" style="font-size:12px;margin-top:4px">Borrar firma</button>
      <button class="btn btn-secondary btn-block" id="b-firmar-terreno" style="font-size:13px">Firmar conformidad</button>`}

    <button class="btn btn-primary btn-block blueprint" id="b-a-cotizar" style="padding:12px;font-size:15px;letter-spacing:.05em;margin-top:18px">${corners}PASAR A COTIZACIÓN →</button>
    <button class="btn btn-secondary btn-block" id="b-volver" style="font-size:13.5px">Volver a captura</button>`;

  $('#b-a-cotizar').onclick = ()=>{
    if(!ot.cot.numero){ ot.cot.numero = 'CT-' + (db.seqCT++) + '/' + String(new Date().getFullYear()).slice(2); save(); }
    S.rol='oficina'; $$('nav.roles button').forEach(b=> b.classList.toggle('on', b.dataset.rol==='oficina'));
    irA('cotizacion');
  };
  $('#b-volver').onclick = ()=>{
    S.rol='terreno'; $$('nav.roles button').forEach(b=> b.classList.toggle('on', b.dataset.rol==='terreno'));
    irA('terreno');
  };
  if(!ot.firmaTerreno.firmado){
    const pad = crearFirmaPad('firma-terreno-canvas', 'b-limpiar-firma-terreno');
    const selContacto = $('#ft-contacto-sel');
    if(selContacto) selContacto.onchange = e=>{
      const suc = contactosTerreno.find(s=> s.id === e.target.value);
      sucursalContactoElegida = suc ? suc.id : ot.sucursalId;
      $('#ft-nombre').value = suc ? suc.encargado||'' : (ot.contactoObra||'');
      $('#ft-telefono').value = suc ? suc.telefono||'' : (ot.contactoObraTelefono||'');
    };
    if(pad) $('#b-firmar-terreno').onclick = async ()=>{
      const nombre = $('#ft-nombre').value.trim();
      const telefono = $('#ft-telefono').value.trim();
      if(!nombre){ toast('Escribe el nombre de quien firma.'); return; }
      if(pad.estaVacia()){ toast('Dibuje la firma antes de confirmar.'); return; }
      ot.contactoObra = nombre; ot.contactoObraTelefono = telefono;
      ot.firmaTerreno = {firmado:true, por: nombre, telefono,
        fecha: new Date().toLocaleString('es-CL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),
        dataUrl: pad.dataUrl()};
      const guardar = $('#ft-guardar-contacto');
      if(guardar && guardar.checked && ot.clienteId){
        const cli = db.clientes.find(c=> c.id === ot.clienteId);
        const suc = cli && cli.sucursales.find(s=> s.id === sucursalContactoElegida);
        if(suc){ suc.encargado = nombre; suc.telefono = telefono; marcarClientes(); }
      }
      save();
      registrarHistorial('Firmó conformidad en terreno', `${ot.codigo} · ${nombre}`);
      render();
      toast('Conformidad en terreno registrada.');
      await sincronizarYa('Firma guardada en este equipo, pero no se pudo subir a la nube. No cierres hasta que sincronice.');
    };
  } else {
    const rehacer = $('#b-rehacer-firma-terreno');
    if(rehacer) rehacer.onclick = ()=>{ ot.firmaTerreno = {firmado:false, por:'', telefono:'', fecha:'', dataUrl:''}; save(); render(); };
  }
  pintarFotosInforme(ot);
}
async function pintarFotosInforme(ot){
  for(const cont of $$('[data-repfotos]')){
    const fotos = (ot.fotos||[]).filter(f=> f.recintoId === cont.dataset.repfotos);
    const recs = await Promise.all(fotos.map(f=> photoGet(f.id)));
    const items = {}; todosItems(ot).forEach(({item})=> items[item.id] = item.code);
    cont.innerHTML = fotos.map((f,i)=> `<figure style="width:88px">
      ${recs[i] ? `<img src="${recs[i].thumb}" style="height:66px;width:88px;object-fit:cover;border:1px solid var(--color-divider)">` : ''}
      <figcaption style="font-size:10.5px">${esc(f.label)} · ${esc(items[f.itemId]||'')}${f.caption?`<br><span style="opacity:.7">${esc(f.caption)}</span>`:''}</figcaption></figure>`).join('');
  }
}

/* ═══════════ 4 · COTIZACIÓN ═══════════ */
function vCotizacion(){
  const ot = getOT(); if(!ot){ irA('visitas'); return; }
  if(!ot.cot.numero) ot.cot.numero = 'CT-' + (db.seqCT++) + '/' + String(new Date().getFullYear()).slice(2);
  const r = calcular(ot);
  const todas = todosItems(ot);
  // Editable mientras no se ha guardado nunca (en_terreno); una vez guardada
  // queda de solo lectura hasta que se apriete "Editar", para que nadie
  // cambie precios sin darse cuenta después de haberla dejado lista.
  const editable = ot.estado === 'en_terreno' || S.cotEditando === ot.id;

  const lineasHTML = editable
    ? (todas.length ? todas.map(({item, recinto})=>{
        const inc = !ot.cot.excluidas[item.id];
        const cant = cantidadItem(ot, item);
        const pu = ot.cot.pu[item.id] !== undefined ? num(ot.cot.pu[item.id]) : num(item.pu);
        return `<div class="card" style="padding:11px;${inc?'':'opacity:.42'}">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <button class="btn btn-secondary" data-inc="${item.id}" style="width:26px;height:26px;min-height:26px;padding:0;flex:none">${inc?'✓':''}</button>
            <div style="flex:1;min-width:0">
              <div style="font-size:9.5px;text-transform:uppercase;opacity:.55;letter-spacing:.06em">${esc(recinto.nombre)} · ${esc(item.code)}</div>
              <div class="card-title" style="font-size:15.5px">${esc(item.desc)}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
            <label style="display:flex;flex-direction:column;gap:3px"><span class="cap">Cant ${esc(UNIDADES[item.unidad]||item.unidad)}</span>
              <input class="input" style="width:82px" inputmode="decimal" data-cant="${item.id}" value="${esc(qty(cant))}"></label>
            <label style="display:flex;flex-direction:column;gap:3px"><span class="cap">P. unitario</span>
              <input class="input" style="width:104px" inputmode="numeric" data-pu="${item.id}" value="${pu||''}"></label>
            <div style="margin-left:auto;text-align:right">
              <div class="cap">Total</div>
              <div style="font-family:var(--font-heading);font-weight:600;font-size:16px" data-tot="${item.id}">${money(cant*pu)}</div>
            </div>
          </div>
        </div>`;
      }).join('') : '<p class="sub">No hay partidas levantadas todavía.</p>')
    : (r.lineas.length ? r.lineas.map(l=> `<div class="card" style="padding:11px;display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="min-width:0">
          <div style="font-size:9.5px;text-transform:uppercase;opacity:.55;letter-spacing:.06em">${esc(l.recinto.nombre)} · ${esc(l.item.code)}</div>
          <div class="card-title" style="font-size:15px">${esc(l.item.desc)}</div>
          <div style="font-size:11px;opacity:.6">${qty(l.cantidad)} ${esc(UNIDADES[l.item.unidad]||l.item.unidad)} · ${money(l.pu)} c/u</div>
        </div>
        <div style="font-family:var(--font-heading);font-weight:600;font-size:15px;white-space:nowrap">${money(l.total)}</div>
      </div>`).join('') : '<p class="sub">No hay partidas incluidas.</p>');

  $('#v-cotizacion').innerHTML = `
    <button class="btn btn-ghost btn-volver" id="b-volver-informe">← Volver al informe</button>
    <div class="kick">Cotización ${esc(ot.cot.numero)} · tarifa ${esc(db.params.tarifa)}</div>
    <h2>${esc(ot.obra || 'Obra sin nombre')}</h2>
    <p class="sub" style="font-size:12px">${editable ? 'Cantidades traídas del levantamiento. Ajusta precio unitario o desmarca partidas.' : 'Cotización guardada. Para cambiar algo, primero apriétale Editar.'}</p>

    <div class="list-grid" style="display:flex;flex-direction:column;gap:11px">${lineasHTML}</div>

    <div class="resumen" style="margin-top:15px">
      <div style="font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;margin-bottom:8px">Resumen económico</div>
      <div class="row"><span>Neto partidas</span><span>${money(r.neto)}</span></div>
      <div class="row"><span>Gastos generales ${Math.round(db.params.gg*100)}%</span><span>${money(r.gg)}</span></div>
      <div class="row" style="align-items:center">
        ${editable
          ? `<span>Utilidad <input class="input" id="in-utilidad" inputmode="decimal" style="width:52px;display:inline-block;padding:2px 6px;font-size:12px;text-align:right" value="${fmtPct(r.utilidadPct)}">%</span>`
          : `<span>Utilidad ${fmtPct(r.utilidadPct)}%</span>`}
        <span>${money(r.utilidad)}</span>
      </div>
      <div class="row"><span>IVA ${Math.round(db.params.iva*100)}%</span><span>${money(r.iva)}</span></div>
      <hr>
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">
        <span class="tot-l">Total con IVA</span><span class="tot-v">${money(r.total)}</span></div>
    </div>

    ${editable
      ? `<button class="btn btn-primary btn-block blueprint" id="b-guardar-cot" style="padding:12px;font-size:15px;letter-spacing:.05em;margin-top:12px">${corners}GUARDAR</button>`
      : `<div class="blueprint" style="padding:10px 14px;margin-top:12px;display:flex;align-items:center;gap:10px">${corners}
          <span style="flex:1;font-size:12px;opacity:.75">Cotización guardada.</span>
          <button class="btn btn-secondary" id="b-editar-cot" style="font-size:12px">Editar</button>
        </div>`}
    <button class="btn btn-secondary btn-block" id="b-pdf" style="font-size:13px">Descargar PDF combinado</button>
    <button class="btn btn-secondary btn-block" id="b-xls" style="font-size:13px">Exportar Excel</button>`;

  $('#b-volver-informe').onclick = ()=> irA('informe');
  $('#b-pdf').onclick = ()=>{ toast('Generando PDF…'); setTimeout(()=> pdfCombinado(ot), 60); };
  $('#b-xls').onclick = ()=> exportarExcel(ot);

  if(editable){
    $$('[data-inc]').forEach(b=> b.onclick = ()=>{
      if(ot.cot.excluidas[b.dataset.inc]) delete ot.cot.excluidas[b.dataset.inc];
      else ot.cot.excluidas[b.dataset.inc] = true;
      save(); render();
    });
    $$('[data-pu]').forEach(inp=> inp.oninput = ()=>{
      inp.value = inp.value.replace(/[^\d]/g,'');
      ot.cot.pu[inp.dataset.pu] = num(inp.value);
      save(); refrescarTotales(ot);
    });
    $$('[data-cant]').forEach(inp=> inp.oninput = ()=>{
      ot.cot.qty[inp.dataset.cant] = inp.value;
      save(); refrescarTotales(ot);
    });
    $('#in-utilidad').oninput = e=>{
      ot.cot.utilidadPct = num(e.target.value)/100;
      save(); refrescarTotales(ot);
    };
    $('#b-guardar-cot').onclick = async ()=>{
      if(ot.estado === 'en_terreno') ot.estado = 'cotizado';
      S.cotEditando = null;
      save();
      registrarHistorial('Guardó una cotización', `${ot.codigo} · ${ot.cot.numero} · ${money(calcular(ot).total)}`);
      setRol('cliente');
      toast('Cotización guardada.');
      await sincronizarYa('Cotización guardada en este equipo, pero no se pudo subir a la nube. No cierres hasta que sincronice.');
    };
  } else {
    $('#b-editar-cot').onclick = ()=>{ S.cotEditando = ot.id; render(); };
  }
}
function refrescarTotales(ot){
  const r = calcular(ot);
  todosItems(ot).forEach(({item})=>{
    const el = $(`[data-tot="${item.id}"]`);
    if(!el) return;
    const pu = ot.cot.pu[item.id] !== undefined ? num(ot.cot.pu[item.id]) : num(item.pu);
    el.textContent = money(cantidadItem(ot,item) * pu);
  });
  const res = $('#v-cotizacion .resumen');
  if(res){
    const rows = $$('.row span:last-child', res);
    if(rows[0]) rows[0].textContent = money(r.neto);
    if(rows[1]) rows[1].textContent = money(r.gg);
    if(rows[2]) rows[2].textContent = money(r.utilidad);
    if(rows[3]) rows[3].textContent = money(r.iva);
    const tv = $('.tot-v', res); if(tv) tv.textContent = money(r.total);
  }
}
</script>

<script>
/* ═══════════ 5 · PANEL DE OFICINA ═══════════ */
function vOficina(){
  const conMonto = db.ots.map(o=> ({o, r: calcular(o)}));
  const enviadas = conMonto.filter(x=> x.o.estado !== 'en_terreno' && x.o.estado !== 'agendada');
  const aprobadas = conMonto.filter(x=> x.o.estado === 'aprobada');
  const totalEnviado = enviadas.reduce((s,x)=> s + x.r.total, 0);
  const cierre = enviadas.length ? Math.round(aprobadas.length / enviadas.length * 100) : 0;
  const porCotizar = conMonto.filter(x=> x.o.estado==='en_terreno' || x.o.estado==='agendada').length;

  $('#v-oficina').innerHTML = `
    <h2 class="h2big">General</h2>
    <p class="sub">Levantamientos del equipo, listos para cotizar y enviar.</p>

    <div class="kpis">
      <div class="kpi blueprint">${corners}<div class="l">Levantamientos</div><div class="v">${db.ots.length}</div><div class="s">en total</div></div>
      <div class="kpi blueprint">${corners}<div class="l">Por cotizar</div><div class="v">${porCotizar}</div><div class="s">agendados o en terreno</div></div>
      <div class="kpi blueprint">${corners}<div class="l">Enviadas</div><div class="v" style="font-size:20px">${money(totalEnviado)}</div><div class="s">en ${enviadas.length} propuesta${enviadas.length===1?'':'s'}</div></div>
      <div class="kpi blueprint">${corners}<div class="l">Tasa cierre</div><div class="v">${cierre}%</div><div class="s">${aprobadas.length} aprobada${aprobadas.length===1?'':'s'}</div></div>
    </div>

    <div class="sec"><span class="n">01</span><h3>Pipeline</h3><span class="rule"></span></div>
    <table class="table"><thead><tr><th>OT / obra</th><th>Estado</th><th style="text-align:right">Monto</th></tr></thead>
      <tbody>${conMonto.length ? conMonto.map(({o,r})=>{
        const t = estadoTag(o);
        return `<tr data-pipe="${o.id}" style="cursor:pointer">
          <td><div style="font-family:var(--font-heading);font-weight:600;font-size:14.5px">${esc(o.obra||'Obra sin nombre')}</div>
              <div style="font-size:10.5px;opacity:.6">${esc(o.codigo)} · ${esc(o.cliente||'sin cliente')}</div></td>
          <td><span class="tag ${t[1]}">${t[0]}</span></td>
          <td class="num" style="font-size:14px">${r.total?money(r.total):'—'}</td></tr>`;
      }).join('') : '<tr><td colspan="3" style="opacity:.6">Todavía no hay levantamientos.</td></tr>'}</tbody></table>

    <div class="sec"><span class="n">02</span><h3>Historial</h3><span class="rule"></span></div>
    <p class="sub" style="font-size:12px">Creaciones, eliminaciones y otros cambios de todo el equipo.</p>
    ${db.historial.length ? db.historial.slice(0, 80).map(h=> `<div style="display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent)">
        <div style="min-width:104px;font-size:10.5px;opacity:.55;white-space:nowrap">${esc(fechaHistorial(h.ts))}</div>
        <div style="flex:1;min-width:0;font-size:12.5px">
          <span style="font-weight:600">${esc(h.accion)}</span>${h.detalle?` — ${esc(h.detalle)}`:''}
        </div>
        <div style="font-size:10.5px;opacity:.55;white-space:nowrap">${esc(h.quien||'—')}</div>
      </div>`).join('') : '<p class="sub">Todavía no hay movimientos registrados.</p>'}`;

  $$('[data-pipe]').forEach(tr=> tr.onclick = ()=>{
    S.otId = tr.dataset.pipe; S.areaIdx = 0;
    const est = getOT().estado;
    irA(est === 'cotizado' || est === 'aprobada' ? 'cotizacion' : 'informe');
  });
}

/* ═══════════ CONFIGURACIÓN (tuerca) ═══════════ */
function abrirConfig(){
  S.volverA = {rol:S.rol, view:S.view};
  irA('config');
}
function vConfig(){
  $('#v-config').innerHTML = `
    <button class="btn btn-ghost btn-volver" id="b-volver-config">← Volver</button>
    <h2 class="h2big">Configuración</h2>
    <p class="sub">Cuentas del equipo, datos de la empresa y catálogo de precios.</p>

    <div class="sec"><span class="n">01</span><h3>Tu cuenta</h3><span class="rule"></span></div>
    <div id="cuenta-box">Cargando…</div>

    <div class="sec"><span class="n">02</span><h3>Datos de la empresa</h3><span class="rule"></span></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <label><span class="cap">Nombre / razón social</span><input class="input" data-e="nombre" value="${esc(db.empresa.nombre)}"></label>
      <label><span class="cap">RUT</span><input class="input" data-e="rut" value="${esc(db.empresa.rut||'')}"></label>
      <label><span class="cap">Dirección</span><input class="input" data-e="direccion" value="${esc(db.empresa.direccion||'')}"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label><span class="cap">Teléfono</span><input class="input" data-e="fono" value="${esc(db.empresa.fono||'')}"></label>
        <label><span class="cap">Email</span><input class="input" data-e="email" value="${esc(db.empresa.email||'')}"></label>
      </div>
      <label><span class="cap">Sitio web</span><input class="input" data-e="web" value="${esc(db.empresa.web||'')}"></label>
    </div>

    <div class="sec"><span class="n">03</span><h3>Parámetros por defecto</h3><span class="rule"></span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <label><span class="cap">Gastos generales %</span><input class="input" inputmode="decimal" data-p="gg" value="${fmtPct(db.params.gg)}"></label>
      <label><span class="cap">IVA %</span><input class="input" inputmode="decimal" data-p="iva" value="${fmtPct(db.params.iva)}"></label>
      <label><span class="cap">Utilidad inicial %</span><input class="input" inputmode="decimal" data-p="utilidadDefault" value="${fmtPct(db.params.utilidadDefault)}"></label>

/* --- Cuenta: entrar, crear la propia, o administrar a las demas personas --- */
let cuentaModo = 'entrar'; // 'entrar' | 'crear'
async function pintarCuenta(){
  const box = $('#cuenta-box'); if(!box) return;
  if(!NUBE.disponible){
    box.innerHTML = `<p class="sub" style="margin:0">Abierta como archivo local: el guardado compartido no está disponible aquí.</p>`;
    return;
  }
  if(NUBE.token){
    box.innerHTML = `<div class="card" style="padding:11px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="flex:1;min-width:0"><span class="cap">Sesión</span>
            <div style="font-family:var(--font-heading);font-weight:600;font-size:16px">${esc(NUBE.nombre)}</div></div>
          <button class="btn btn-secondary" id="b-sync" style="font-size:12px">Sincronizar</button>
          <button class="btn btn-secondary" id="b-cerrar-sesion" style="font-size:12px">Cerrar sesión</button>
        </div>
      </div>
      <div id="personas-box" style="margin-top:10px"></div>`;
    $('#b-sync').onclick = ()=> sincronizar(true);
    $('#b-cerrar-sesion').onclick = ()=>{ cerrarSesion(); render(); };
    await pintarPersonas();
    return;
  }
  let usuarios = [];
  try{ usuarios = await api('usuarios'); }
  catch(e){
    box.innerHTML = `<p class="sub" style="margin:0;color:var(--color-accent-700)">No se pudo conectar con la nube todavía.</p>`;
    return;
  }
  if(!usuarios.length) cuentaModo = 'crear';

  if(cuentaModo === 'crear'){
    box.innerHTML = `
      <p class="sub" style="margin:0 0 8px">${usuarios.length? 'Crea tu cuenta para entrar.' : 'Nadie ha entrado todavía: crea la cuenta de la primera persona.'}</p>
      <div style="display:flex;flex-direction:column;gap:8px">
        <label><span class="cap">Tu nombre</span><input class="input" id="c-nombre" placeholder="Nombre y apellido"></label>
        <label><span class="cap">Clave</span><input class="input" type="password" id="c-clave" placeholder="Elige una clave"></label>
        <label><span class="cap">Repite la clave</span><input class="input" type="password" id="c-clave2"></label>
        <button class="btn btn-primary" id="b-crear-cuenta">Crear cuenta y entrar</button>
        ${usuarios.length? `<button class="btn btn-ghost" id="b-ir-entrar" style="font-size:12px">Ya tengo cuenta</button>` : ''}
      </div>`;
    $('#b-crear-cuenta').onclick = async ()=>{
      const nombre = $('#c-nombre').value.trim();
      const clave = $('#c-clave').value, clave2 = $('#c-clave2').value;
      if(!nombre || !clave){ toast('Escribe tu nombre y una clave.'); return; }
      if(clave !== clave2){ toast('Las claves no coinciden.'); return; }
      try{
        const claveHash = await sha256(clave);
        await api('usuarios', {method:'POST', body: JSON.stringify({nombre, claveHash})});
        const r = await api('login', {method:'POST', body: JSON.stringify({nombre, claveHash})});
        guardarSesion(r.token, r.nombre);
        setNube('pend'); sincronizar(true); render();
        toast('Cuenta creada. Bienvenido, ' + r.nombre + '.');
      }catch(e){ toast(e.message || 'No se pudo crear la cuenta.'); }
    };
    if(usuarios.length) $('#b-ir-entrar').onclick = ()=>{ cuentaModo='entrar'; pintarCuenta(); };
    return;
  }

  box.innerHTML = `
    <p class="sub" style="margin:0 0 8px">Entra con tu nombre y tu clave.</p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label><span class="cap">Nombre</span>
        <select class="input" id="c-nombre-sel">${usuarios.map(u=> `<option value="${esc(u.nombre)}">${esc(u.nombre)}</option>`).join('')}</select></label>
      <label><span class="cap">Clave</span><input class="input" type="password" id="c-clave-in"></label>
      <button class="btn btn-primary" id="b-entrar">Entrar</button>
      <button class="btn btn-ghost" id="b-ir-crear" style="font-size:12px">Soy una persona nueva</button>
    </div>`;
  $('#b-entrar').onclick = async ()=>{
    const nombre = $('#c-nombre-sel').value;
    const clave = $('#c-clave-in').value;
    if(!clave){ toast('Escribe tu clave.'); return; }
    try{
      const claveHash = await sha256(clave);
      const r = await api('login', {method:'POST', body: JSON.stringify({nombre, claveHash})});
      guardarSesion(r.token, r.nombre);
      setNube('pend'); sincronizar(true); render();
      toast('Hola, ' + r.nombre + '.');
    }catch(e){ toast('Nombre o clave incorrectos.'); }
  };
  $('#b-ir-crear').onclick = ()=>{ cuentaModo='crear'; pintarCuenta(); };
}

async function pintarPersonas(){

      const nombre = $('#np-nombre').value.trim();
      const clave = $('#np-clave').value;
      if(!nombre || !clave){ toast('Falta el nombre o la clave.'); return; }
      try{
        const claveHash = await sha256(clave);
        await api('usuarios', {method:'POST', body: JSON.stringify({nombre, claveHash})});
        registrarHistorial('Agregó a una persona al equipo', nombre);
        toast(nombre + ' fue agregado.');
        await pintarPersonas();
      }catch(e){ toast(e.message || 'No se pudo agregar.'); }
    };
  };
}

/* ═══════════ CLIENTES: directorio con sucursales y cotizaciones ═══════════ */
let filtroCliente = '';
/** Lista unificada: fichas reales de db.clientes + nombres sueltos que ya
 *  tienen OT pero nunca se incorporaron como cliente (datos de antes de esta
 *  función, o cargados a mano en terreno). */
function directorioClientes(){
  const fichas = db.clientes.map(c=> ({
    id: c.id, nombre: c.nombre, legacy:false,
    ots: db.ots.filter(o=> o.clienteId === c.id)
  }));
  const nombresConFicha = new Set(db.clientes.map(c=> c.nombre.toLowerCase()));
  const sueltos = new Map();
  db.ots.forEach(o=>{
    if(o.clienteId || !o.cliente) return;
    const k = o.cliente.toLowerCase();
    if(nombresConFicha.has(k)) return;
    if(!sueltos.has(k)) sueltos.set(k, {id:null, nombre:o.cliente, legacy:true, ots:[]});
    sueltos.get(k).ots.push(o);
  });
  return fichas.concat(Array.from(sueltos.values())).sort((a,b)=> a.nombre.localeCompare(b.nombre,'es'));
}
function vClientes(){
  $('#v-clientes').innerHTML = `
    <h2 class="h2big">Clientes</h2>
    <p class="sub">Cada cliente puede tener varias sucursales y cotizaciones.</p>
    <input class="input" id="buscar-cliente" placeholder="Buscar cliente…" value="${esc(filtroCliente)}" style="margin-bottom:12px">
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn btn-primary blueprint" id="b-incorporar-cliente" style="flex:1;font-size:13px">${corners}+ Incorporar cliente</button>
      <button class="btn btn-secondary" id="b-importar-clientes" style="flex:1;font-size:13px">Importación masiva</button>
    </div>
    <div id="lista-clientes" class="list-grid" style="display:flex;flex-direction:column"></div>`;
  $('#buscar-cliente').oninput = e=>{ filtroCliente = e.target.value; pintarListaClientes(); };
  $('#b-incorporar-cliente').onclick = ()=> abrirSheet('incorporar-cliente');
  $('#b-importar-clientes').onclick = ()=> abrirSheet('importar-clientes');
  pintarListaClientes();
}

  $('#lista-clientes').innerHTML = lista.length ? lista.map(c=>{
    const sucs = c.legacy ? 0 : (db.clientes.find(x=> x.id===c.id)||{sucursales:[]}).sucursales.length;

          <div style="font-size:11.5px;opacity:.65;margin-top:2px">${c.legacy? 'Sin ficha completa · ' : `${sucs} sucursal${sucs===1?'':'es'} · `}${c.ots.length} OT${c.ots.length===1?'':'s'}${enviadas?` · ${enviadas} enviada${enviadas===1?'':'s'}`:''}</div>
        </div>
        <span class="tag tag-outline">${c.ots.length}</span>
      </div>

  }).join('') : `<div class="blueprint" style="padding:20px 14px;text-align:center">${corners}
      <div style="font-family:var(--font-heading);font-weight:600;font-size:18px">${q? 'Sin resultados' : 'Aún no hay clientes'}</div>

    else { S.clienteId = v; S.clienteNombre = null; }
    irA('cliente-detalle');
  });
}

  if(!ficha && !S.clienteNombre){ irA('clientes'); return; }

    <div class="sec"><span class="n">${ficha?'02':'01'}</span><h3>Cotizaciones</h3><span class="rule"></span></div>
    ${ots.length ? ots.map(o=>{
      const r = calcular(o); const t = estadoTag(o);

    }).join('') : '<p class="sub">Este cliente todavía no tiene cotizaciones.</p>'}`;

  const completar = $('#b-completar-ficha');

}

/** Panel de firma reutilizable: dibuja en un canvas y expone si quedó vacío
 *  y su imagen, sin decidir qué hacer con eso (cada vista lo resuelve). */
function crearFirmaPad(canvasId, limpiarId){
  const cv = $('#'+canvasId); if(!cv) return null;
  const dpr = window.devicePixelRatio || 1;
  cv.width = cv.offsetWidth * dpr; cv.height = 120 * dpr;
  const cx = cv.getContext('2d');
  cx.scale(dpr, dpr); cx.strokeStyle = '#1d1f20'; cx.lineWidth = 2;
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  let dibujando = false, vacio = true;
  const pos = e=>{
    const r = cv.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: p.clientX - r.left, y: p.clientY - r.top};
  };
  const ini = e=>{ dibujando = true; vacio = false; const {x,y} = pos(e); cx.beginPath(); cx.moveTo(x,y); e.preventDefault(); };
  const mov = e=>{ if(!dibujando) return; const {x,y} = pos(e); cx.lineTo(x,y); cx.stroke(); e.preventDefault(); };
  const fin = ()=>{ dibujando = false; };
  cv.addEventListener('pointerdown', ini); cv.addEventListener('pointermove', mov);
  window.addEventListener('pointerup', fin);
  const limpiarBtn = $('#'+limpiarId);
  if(limpiarBtn) limpiarBtn.onclick = ()=>{ cx.clearRect(0,0,cv.width,cv.height); vacio = true; };
  return { estaVacia: ()=> vacio, dataUrl: ()=> cv.toDataURL('image/png') };
}

function montarFirma(ot){
  const pad = crearFirmaPad('firma-canvas', 'b-limpiar-firma'); if(!pad) return;
  const clienteFicha = ot.clienteId && db.clientes.find(c=> c.id === ot.clienteId);
  const contactos = clienteFicha ? clienteFicha.sucursales.filter(s=> s.encargado) : [];
  let sucursalElegida = ot.sucursalId;

  const selContacto = $('#fc-contacto-sel');
  if(selContacto) selContacto.onchange = e=>{
    const suc = contactos.find(s=> s.id === e.target.value);
    sucursalElegida = suc ? suc.id : ot.sucursalId;
    $('#fc-nombre').value = suc ? suc.encargado||'' : (ot.cliente||'');
    $('#fc-telefono').value = suc ? suc.telefono||'' : '';
  };

  const datosFirma = via=>{
    const nombre = $('#fc-nombre').value.trim();
    const telefono = $('#fc-telefono').value.trim();
    const guardar = $('#fc-guardar-contacto');
    if(guardar && guardar.checked && ot.clienteId){
      const cli = db.clientes.find(c=> c.id === ot.clienteId);
      const suc = cli && cli.sucursales.find(s=> s.id === sucursalElegida);
      if(suc){ suc.encargado = nombre || suc.encargado; suc.telefono = telefono; marcarClientes(); }
    }
    return {firmado:true, por: nombre || ot.cliente || 'el cliente', telefono, via,
      fecha: new Date().toLocaleString('es-CL',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})};
  };

  $('#b-firmar').onclick = async ()=>{
    if(!$('#fc-nombre').value.trim()){ toast('Escribe el nombre de quien aprueba.'); return; }
    if(pad.estaVacia()){ toast('Dibuje la firma antes de aprobar.'); return; }
    ot.firma = Object.assign(datosFirma('firma'), {dataUrl: pad.dataUrl()});
    ot.estado = 'aprobada';
    save();
    registrarHistorial('Cliente aprobó la cotización (con firma)', `${ot.codigo} · ${ot.firma.por}`);
    render();
    toast('Cotización aprobada. Se abre OT de ejecución.');
    await sincronizarYa('Firma guardada en este equipo, pero no se pudo subir a la nube. No cierres hasta que sincronice.');
  };
  $('#b-aprobar-correo').onclick = async ()=>{
    if(!$('#fc-nombre').value.trim()){ toast('Escribe el nombre de quien aprueba.'); return; }
    ot.firma = Object.assign(datosFirma('correo'), {dataUrl:''});
    ot.estado = 'aprobada';
    save();
    registrarHistorial('Cliente aprobó la cotización (por correo)', `${ot.codigo} · ${ot.firma.por}`);
    render();
    toast('Cotización aprobada (por correo). Se abre OT de ejecución.');
    await sincronizarYa('Aprobación guardada en este equipo, pero no se pudo subir a la nube. No cierres hasta que sincronice.');
  };
  $('#b-cambios').onclick = ()=> toast('Observación enviada a la oficina técnica.');
}

<script>
/* ═══════════ SHEETS ═══════════ */
function abrirSheet(tipo){
  S.sheet = tipo;
  if(tipo === 'agendar') agendaSel = {clienteId:'', sucursalId:'', nuevo:false};
  pintarSheet();
  $('#overlay').classList.add('on');
}
function cerrarSheet(){ const habia = S.sheet; S.sheet = null; $('#overlay').classList.remove('on'); if(habia) render(); }

/** Lista desplegable del buscador de cliente/sucursal en "Datos de la OT". */
function pintarOpcionesClienteOT(ot, texto){
  const cont = $('#cliente-opciones'); if(!cont) return;
  const q = texto.trim().toLowerCase();
  const todas = opcionesClienteSucursal();
  const filtradas = q ? todas.filter(o=> o.clienteNombre.toLowerCase().includes(q) || o.sucursalNombre.toLowerCase().includes(q)) : todas;
  const items = filtradas.slice(0, 8).map(o=> `<button type="button" class="autocomplete-item" data-elegir="${o.clienteId}|${o.sucursalId}">
      ${esc(o.clienteNombre)}<span class="s">${esc(o.sucursalNombre)}</span></button>`).join('');
  const nuevo = q ? `<button type="button" class="autocomplete-item autocomplete-nuevo" id="b-cliente-nuevo-inline">+ Crear cliente nuevo: "${esc(texto.trim())}"</button>` : '';
  if(!items && !nuevo){ cont.style.display = 'none'; return; }
  cont.innerHTML = items + nuevo;
  cont.style.display = 'block';
  $$('[data-elegir]', cont).forEach(b=> b.onclick = ()=>{
    const [cid, sid] = b.dataset.elegir.split('|');
    const cliente = db.clientes.find(x=> x.id === cid);
    const suc = cliente && cliente.sucursales.find(x=> x.id === sid);
    if(!cliente || !suc) return;
    ot.clienteId = cliente.id; ot.cliente = cliente.nombre; ot.sucursalId = suc.id;
    if(suc.direccion) ot.direccion = suc.direccion;
    if(suc.encargado && !ot.contactoObra) ot.contactoObra = suc.encargado;
    if(suc.telefono && !ot.contactoObraTelefono) ot.contactoObraTelefono = suc.telefono;
    save(); pintarSheet();
  });
  const btnNuevo = $('#b-cliente-nuevo-inline', cont);
  if(btnNuevo) btnNuevo.onclick = ()=>{
    clienteIncorporarDesdeOT = ot.id;
    S.clienteNombre = texto.trim();
    abrirSheet('incorporar-cliente');
  };
}

function pintarSheet(){
  const ot = getOT(); const s = $('#sheet');
  const cab = (titulo, bajada)=> `<div class="sheet-h"><h3>${titulo}</h3>
      <button class="btn btn-ghost" id="b-cerrar-sheet" style="font-size:13px">Cerrar</button></div>
    <p class="sub" style="font-size:12px">${bajada}</p>`;

  if(S.sheet === 'catalogo'){
    const rec = getRecinto(ot);
    s.innerHTML = cab('Catálogo de partidas', `Se agrega a <strong>${esc(rec.nombre)}</strong> con precio unitario base.`) +
      `<div style="display:flex;flex-direction:column;gap:8px">
        ${db.catalogo.map(c=> `<button class="card" data-cat="${c.id}" style="cursor:pointer;text-align:left;flex-direction:row;align-items:center;gap:10px">
          <div style="flex:1;min-width:0">
            <div class="card-kicker">${esc(c.code)} · ${esc(c.familia)}</div>
            <div class="card-title" style="font-size:15.5px">${esc(c.desc)}</div>
          </div>

            <div style="font-family:var(--font-heading);font-weight:600;font-size:14px">${money(c.pu)}</div>

          </div></button>`).join('')}
      </div>`;
    $$('[data-cat]').forEach(b=> b.onclick = ()=>{
      const c = db.catalogo.find(x=> x.id === b.dataset.cat);
      const med = {}; (c.dims||[]).forEach(d=> med[d] = (d === 'cantidad') ? 1 : '');
      rec.items.push({id:uid(), code:c.code, familia:c.familia, desc:c.desc,
                      unidad:c.unidad, pu:c.pu, dims:(c.dims||[]).slice(), med, nota:''});
      save(); cerrarSheet(); render();
    });
  }

  if(S.sheet === 'checklist'){
    s.innerHTML = cab('Condiciones del sitio', 'Marca lo que aplica; entra en el informe.') +
      `<div style="display:flex;flex-direction:column;gap:8px">
        ${CHECKLIST_BASE.map(ck=>{
          const v = ot.checks[ck.key] || {on:false, valor:''};
          return `<div class="card" style="flex-direction:row;align-items:center;gap:10px;padding:10px">
            <button class="btn btn-secondary" data-chk="${ck.key}" style="width:24px;height:24px;min-height:24px;padding:0;flex:none">${v.on?'✓':'—'}</button>
            <div style="flex:1;min-width:0">
              <div style="font-size:13.5px">${esc(ck.label)}</div>

            </div></div>`;
        }).join('')}
      </div>`;
    $$('[data-chk]').forEach(b=> b.onclick = ()=>{
      const k = b.dataset.chk;
      ot.checks[k] = ot.checks[k] || {on:false, valor:''};
      ot.checks[k].on = !ot.checks[k].on;
      save(); pintarSheet();
    });
    $$('[data-chkval]').forEach(inp=> inp.oninput = ()=>{
      const k = inp.dataset.chkval;
      ot.checks[k] = ot.checks[k] || {on:false, valor:''};
      ot.checks[k].valor = inp.value; save();
    });
  }

  if(S.sheet === 'datos'){
    const sucAsignada = ot.clienteId && (db.clientes.find(c=> c.id===ot.clienteId)||{sucursales:[]}).sucursales.find(s=> s.id===ot.sucursalId);
    s.innerHTML = cab('Datos de la OT', 'Antecedentes que encabezan el informe y la cotización. La OT debe quedar asignada a un cliente.') +
      `<div style="display:flex;flex-direction:column;gap:10px">
        <label><span class="cap">Obra</span><input class="input" data-ot="obra" value="${esc(ot.obra||'')}"></label>

        <label class="autocomplete-wrap"><span class="cap">Cliente${sucAsignada ? ' — ' + esc(sucAsignada.nombre) : ''}</span>
          <input class="input" id="in-cliente-buscar" placeholder="Buscar cliente…" autocomplete="off" value="${esc(ot.cliente||'')}">
          <div id="cliente-opciones" class="autocomplete-list" style="display:none"></div>
        </label>

        ${[['contactoObra','Contacto en obra (firma en terreno)'],['contactoObraTelefono','Teléfono del contacto en obra'],
           ['email','Email del cliente'],['direccion','Dirección'],
           ['comuna','Comuna'],['levantoPor','Levantó (nombre · cargo)'],['fechaVisita','Fecha de visita']].map(([k,l])=>
          `<label><span class="cap">${l}</span><input class="input" data-ot="${k}" ${k==='fechaVisita'?'type="date"':''} value="${esc(ot[k]||'')}"></label>`).join('')}
      </div>`;
    $$('[data-ot]').forEach(inp=> inp.oninput = ()=>{ ot[inp.dataset.ot] = inp.value; save(); });

    const buscador = $('#in-cliente-buscar');
    buscador.oninput = ()=>{
      ot.cliente = buscador.value; ot.clienteId = null; ot.sucursalId = null;
      save(); pintarOpcionesClienteOT(ot, buscador.value);

    buscador.onfocus = ()=> pintarOpcionesClienteOT(ot, buscador.value);
    buscador.onblur = ()=> setTimeout(()=>{ const c = $('#cliente-opciones'); if(c) c.style.display='none'; }, 150);
  }

  if(S.sheet === 'precios'){
    s.innerHTML = cab('Catálogo de precios', `Tarifa ${esc(db.params.tarifa)}. Los valores son de ejemplo: reemplázalos por la lista real de ALFEX.`) +
      `<div style="display:flex;flex-direction:column;gap:8px">
        ${db.catalogo.map(c=> `<div class="card" style="flex-direction:row;align-items:center;gap:10px;padding:10px">
          <div style="flex:1;min-width:0">
            <div class="card-kicker">${esc(c.code)} · ${esc(c.familia)}</div>
            <div style="font-size:13px">${esc(c.desc)}</div>
          </div>
          <label style="text-align:right"><span class="cap">$ por ${esc(UNIDADES[c.unidad]||c.unidad)}</span>
            <input class="input" style="width:100px;text-align:right" inputmode="numeric" data-precio="${c.id}" value="${c.pu}"></label>
        </div>`).join('')}
      </div>`;
    $$('[data-precio]').forEach(inp=> inp.oninput = ()=>{
      const c = db.catalogo.find(x=> x.id === inp.dataset.precio);
      c.pu = num(inp.value.replace(/[^\d]/g,''));
      marcarAjustes();
    });
  }

  if(S.sheet === 'catalogo-import'){
